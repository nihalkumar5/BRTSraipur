pluginManagement {
    def resolveNode = {
        def candidates = []
        if (System.getenv("NODE_BINARY")) candidates.add(System.getenv("NODE_BINARY"))
        def userHome = System.getProperty("user.home")
        def nvmDir = new File(userHome, ".nvm/versions/node")
        if (nvmDir.exists()) {
            nvmDir.listFiles()?.sort { a, b -> b.name <=> a.name }?.each { dir ->
                candidates.add(new File(dir, "bin/node").absolutePath)
            }
        }
        candidates.add("/opt/homebrew/bin/node")
        candidates.add("/usr/local/bin/node")
        candidates.add("/usr/bin/node")

        def updateProcessPath = { String nodePath ->
            try {
                def nodeDir = new File(nodePath).parent
                def pe = Class.forName("java.lang.ProcessEnvironment")
                def theEnv = pe.getDeclaredField("theEnvironment")
                theEnv.setAccessible(true)
                Map env = (Map) theEnv.get(null)
                
                def varClass = Class.forName("java.lang.ProcessEnvironment\$Variable")
                def valClass = Class.forName("java.lang.ProcessEnvironment\$Value")
                def varMethod = varClass.getDeclaredMethod("valueOf", String.class)
                varMethod.setAccessible(true)
                def valMethod = valClass.getDeclaredMethod("valueOf", String.class)
                valMethod.setAccessible(true)

                def pathVar = varMethod.invoke(null, "PATH")
                def currentVal = env.get(pathVar)?.toString() ?: ""
                if (!currentVal.contains(nodeDir)) {
                    def newVal = valMethod.invoke(null, "${nodeDir}:/opt/homebrew/bin:/usr/local/bin:${currentVal}")
                    env.put(pathVar, newVal)
                }
            } catch (Throwable ignored) {}
        }

        for (candidate in candidates) {
            if (candidate && new File(candidate).exists()) {
                updateProcessPath(candidate)
                return candidate
            }
        }
        return "node"
    }
    def node = resolveNode()
    includeBuild(new File([node, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().toString())
}
