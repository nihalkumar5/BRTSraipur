<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tatpar BRTS Raipur</title>

    <!--
      viewport: width=device-width locks layout width to the screen.
      initial-scale=1 sets 1:1 pixel ratio.
      maximum-scale=1, user-scalable=no prevents pinch-zoom (app-like feel).
      viewport-fit=cover extends into safe-area notches.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />

    <!-- PWA / mobile-web-app behaviour -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tatpar BRTS" />
    <meta name="application-name" content="Tatpar BRTS" />
    <meta name="theme-color" content="#18258F" />
    <meta name="msapplication-TileColor" content="#18258F" />

    <!-- High Resolution Favicons & Add to Homescreen Apple/Android Icons -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      try {
        if (localStorage.getItem('tatpar_dark_mode') === 'true') {
          document.documentElement.classList.add('dark-theme');
        }
      } catch(e) {}
    </script>

    <!-- Prevent text size auto-adjustment and disable pinch zoom / double tap zoom -->
    <style>
      html, body, #root {
        background-color: #F8F6F0;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: pan-x pan-y;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      * {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
    </style>
    <script>
      (function() {
        // Prevent multi-touch pinch zoom
        document.addEventListener('touchstart', function(e) {
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent double tap zoom
        var lastTouch = 0;
        document.addEventListener('touchend', function(e) {
          var now = Date.now();
          if (now - lastTouch <= 300) {
            e.preventDefault();
          }
          lastTouch = now;
        }, false);

        // Prevent iOS Safari gesture zoom
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
