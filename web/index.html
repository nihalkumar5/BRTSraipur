<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tatpar BRTS Raipur</title>

    <!--
      viewport: width=device-width locks layout width to the screen.
      initial-scale=1 sets 1:1 pixel ratio.
      maximum-scale=1, user-scalable=no prevents pinch-zoom (app-like feel).
      viewport-fit=cover extends into safe-area notches.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA / mobile-web-app behaviour -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tatpar BRTS" />
    <meta name="application-name" content="Tatpar BRTS" />
    <meta name="theme-color" content="#18258F" />
    <meta name="msapplication-TileColor" content="#18258F" />

    <!-- High Resolution Favicons & Add to Homescreen Apple/Android Icons -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Prevent text size auto-adjustment on orientation change -->
    <style>
      html, body, #root {
        background-color: #F8F6F0;
        margin: 0;
        overflow: hidden;
        /* Prevent rubber-band / overscroll on iOS Safari */
        overscroll-behavior: none;
      }
      /* Remove tap highlight on mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
